name: Daily Mining Skills Pipeline

on:
  schedule:
    # Tous les jours à 6h00 UTC (7h/8h heure du Maroc selon saison)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Permet de le lancer manuellement depuis GitHub

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Initialiser la base de données
        run: python src/db/init_extraction_tables.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Collecter les nouvelles offres
        run: python src/collectors/run_all.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Marquer les offres fermées
        run: python src/collectors/mark_closed_jobs.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Extraire les compétences (1 batch)
        run: python src/extraction/extract_batch.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit et push la base mise à jour
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/jobs.db
          git diff --staged --quiet || git commit -m "Daily pipeline run: $(date +'%Y-%m-%d')"
          git push